# Impulso Engine update channel. Set this to the HTTPS URL of the published
# manifest. A dash keeps automatic checks disabled in development builds.
manifest -
auto_download 1

# Manifest format (plain text or equivalent JSON):
# IMPULSO_UPDATE 1
# version 0.2.1
# url https://updates.example.com/impulso-0.2.1.exe
# sha256 <64 lowercase hexadecimal characters>
# notes Description shown in the editor

